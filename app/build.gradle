plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

// Version overrides are allowed only when BOTH values are supplied by the
// protected GitHub auto-release job. Local AndroidIDE builds keep their stable
// version and signing configuration; never store release secrets in Gradle.
def releaseVersionNameOverride = project.findProperty('BIBLIOTECA_VERSION_NAME')?.toString()
def releaseVersionCodeOverride = project.findProperty('BIBLIOTECA_VERSION_CODE')?.toString()
if ((releaseVersionNameOverride == null) != (releaseVersionCodeOverride == null)) {
    throw new GradleException('Specify both BIBLIOTECA_VERSION_NAME and BIBLIOTECA_VERSION_CODE')
}
if (releaseVersionNameOverride != null &&
    !(releaseVersionNameOverride ==~ /[0-9]+\.[0-9]+\.[0-9]+/)) {
    throw new GradleException('Invalid semantic release version')
}
def configuredVersionCode = releaseVersionCodeOverride == null ? 1 : Integer.parseInt(releaseVersionCodeOverride)
if (configuredVersionCode < 1 || configuredVersionCode > 2100000000) {
    throw new GradleException('Release versionCode is outside Android limits')
}

def qaRequested = project.findProperty('BIBLIOTECA_QA')?.toString() == 'true'

android {
    namespace 'com.javierrb35.bibliotecaia'
    compileSdk 34

    defaultConfig {
        applicationId "com.javierrb35.bibliotecaia"
        minSdk 26
        targetSdk 34
        versionCode configuredVersionCode
        versionName (releaseVersionNameOverride ?: "0.1.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [appLabel: '@string/app_name']
        buildConfigField 'boolean', 'QA_BUILD', 'false'
    }

    buildFeatures { buildConfig true }

    buildTypes {
        debug {
            if (qaRequested) {
                applicationIdSuffix '.qa'
                versionNameSuffix '-qa'
                manifestPlaceholders = [appLabel: 'BibliotecaAI QA']
                buildConfigField 'boolean', 'QA_BUILD', 'true'
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// Esquemas Room versionados para migraciones explícitas (Prompt Maestro §15.7)
ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

dependencies {
    // Lector EPUB (Readium 3.0.x: última línea que apunta a SDK 34) + sanitizado HTML
    implementation 'org.readium.kotlin-toolkit:readium-shared:3.0.3'
    implementation 'org.readium.kotlin-toolkit:readium-streamer:3.0.3'
    implementation 'org.readium.kotlin-toolkit:readium-navigator:3.0.3'
    implementation 'org.jsoup:jsoup:1.17.2'
    // Bundled on-device Latin-script OCR: no network or Google account required.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    // Battery-aware periodic updates; minimum 15 minutes per Android scheduler.
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Persistencia local (Incremento 1 — biblioteca offline)
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    testImplementation 'junit:junit:4.13.2'
    // Des-duplicar el stub de org.json del SDK para tests JVM con JSON real
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
