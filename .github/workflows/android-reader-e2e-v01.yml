name: Android v0.1 reading journeys - EPUB and MOBI plus contextual AI

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/com/javierrb35/bibliotecaia/reader/**'
      - 'app/src/main/java/com/javierrb35/bibliotecaia/ai/BookTextSource.kt'
      - 'app/src/androidTest/java/com/javierrb35/bibliotecaia/reader/**'
      - '.github/workflows/android-reader-e2e-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-e2e-v01-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reader-journeys:
    name: Reader UI mark-close-reopen-edit-delete in EPUB and MOBI (API 34)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM or use software CPU
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          else
            echo "No KVM available; emulator falls back to TCG."
          fi
      - name: Run EPUB and MOBI reader journeys on real Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_5
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: sh ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.javierrb35.bibliotecaia.reader.mobi.MobiReadingJourneyDeviceTest,com.javierrb35.bibliotecaia.reader.epub.EpubReadingJourneyDeviceTest --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.vfs.watch=false
      - name: Archive test XML and failure context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epub-mobi-reading-journeys-results
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 7
