name: Premium Android UI visual proof

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/**'
      - 'app/src/androidTest/java/com/javierrb35/bibliotecaia/ui/PremiumVisualProofDeviceTest.kt'
      - '.github/workflows/premium-visual-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  premium-android-emulator:
    name: Render library, knowledge and settings; assert four-action dock
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out production UI under test
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator hardware acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture exact rendered premium UI from a real Android Activity
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            sh ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.javierrb35.bibliotecaia.ui.PremiumVisualProofDeviceTest --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.vfs.watch=false
            mkdir -p ui-proof
            adb pull /sdcard/Android/data/com.javierrb35.bibliotecaia/files/premium-ui-proof/. ui-proof/
            test -s ui-proof/biblioteca-premium-v035.png
            test -s ui-proof/conocimiento-premium-v035.png
            test -s ui-proof/ajustes-premium-v035.png
      - name: Publish rendered screenshots and test reports as reviewable artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bibliotecaia-premium-rendered-android-screens
          path: |
            ui-proof/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 14
