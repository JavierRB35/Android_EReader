name: Automatically publish signed Android updates

# A production update is published ONLY after BOTH independent checks for the
# very same main commit have passed. workflow_run can use secrets, therefore
# never checkout untrusted PR head or accept a pull_request event.
on:
  workflow_run:
    workflows:
      - Android quality gate
      - Android startup smoke (emulator)
    types: [completed]
    branches: [main]

concurrency:
  group: bibliotecaia-automatic-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Verify matching main quality gates and release identity
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      sha: ${{ steps.check.outputs.sha }}
      version: ${{ steps.check.outputs.version }}
      version_code: ${{ steps.check.outputs.version_code }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Check out the exact verified main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Check both CI runs, main HEAD and existing releases
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "publish=false" >> "$GITHUB_OUTPUT"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

          main_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$SOURCE_SHA" != "$main_head" ]]; then
            echo "Skipping obsolete commit $SOURCE_SHA (current main: $main_head)"
            exit 0
          fi

          for workflow in android-ci.yml android-startup-smoke.yml; do
            count="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&event=push&head_sha=$SOURCE_SHA&per_page=50" \
              --jq '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success")] | length')"
            if [[ "$count" -lt 1 ]]; then
              echo "Waiting for successful $workflow on $SOURCE_SHA"
              exit 0
            fi
          done

          # The two workflow_run events may finish in either order. With one
          # serialized publication queue, do not issue two releases for a SHA.
          already="$(gh api -X GET "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.target_commitish == \"$SOURCE_SHA\") | .tag_name" | head -n 1)"
          if [[ -n "$already" ]]; then
            echo "Already published for $SOURCE_SHA: $already"
            exit 0
          fi

          # Keep the current 0.1 development series until its owner accepts 1.0.
          # Derive major.minor from Gradle's default versionName.
          base="$(sed -nE 's/^[[:space:]]*versionName.*"([0-9]+)\.([0-9]+)\.[0-9]+".*/\1.\2/p' app/build.gradle | head -n 1)"
          [[ "$base" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "::error::Missing semantic base version" >&2; exit 1; }
          version="$base.$GITHUB_RUN_NUMBER"
          code="$((100000 + GITHUB_RUN_NUMBER))"
          (( code > 1 && code <= 2100000000 )) || exit 1
          tag="v$version"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::The candidate tag $tag already exists; refusing to replace it" >&2
            exit 1
          fi
          {
            echo "sha=$SOURCE_SHA"
            echo "version=$version"
            echo "version_code=$code"
            echo "tag=$tag"
            echo "publish=true"
          } >> "$GITHUB_OUTPUT"
          echo "Approved: $tag / versionCode=$code / source=$SOURCE_SHA"

  build:
    name: Build signed update with the pinned owner certificate
    needs: preflight
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout the checked commit (never PR code)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble APK with a strictly increasing Android versionCode
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_CODE: ${{ needs.preflight.outputs.version_code }}
          # Public, client-side configuration only: never use service-role or private keys.
          BIBLIOTECA_SUPABASE_URL: ${{ vars.BIBLIOTECA_SUPABASE_URL }}
          BIBLIOTECA_SUPABASE_KEY: ${{ vars.BIBLIOTECA_SUPABASE_KEY }}
          BIBLIOTECA_GOOGLE_WEB_CLIENT_ID: ${{ vars.BIBLIOTECA_GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          sh ./gradlew :app:assembleRelease \
            "-PBIBLIOTECA_VERSION_NAME=$RELEASE_VERSION" \
            "-PBIBLIOTECA_VERSION_CODE=$RELEASE_CODE" \
            --no-daemon --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.vfs.watch=false
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Zipalign, sign and verify APK and its package version
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_CODE: ${{ needs.preflight.outputs.version_code }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing keystore}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing keystore password}"
          : "${ANDROID_KEY_ALIAS:?Missing key alias}"
          : "${ANDROID_KEY_PASSWORD:?Missing key password}"
          expected="$(printf '%s' "$ANDROID_RELEASE_CERT_SHA256" | tr -d '[:space:]:-' | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Missing certificate SHA256 Actions Variable" >&2; exit 1; }
          store="$RUNNER_TEMP/release-keystore.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$store"
          chmod 600 "$store"
          tools="$ANDROID_HOME/build-tools/34.0.0"
          "$tools/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          mkdir -p dist
          apk="dist/BibliotecaIA-$RELEASE_TAG.apk"
          "$tools/apksigner" sign \
            --ks "$store" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$apk" "$RUNNER_TEMP/aligned.apk"
          verified="$("$tools/apksigner" verify --verbose --print-certs "$apk")"
          actual="$(printf '%s\n' "$verified" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr '[:upper:]' '[:lower:]')"
          [[ "$actual" == "$expected" ]] || { echo "::error::Release certificate mismatch" >&2; exit 1; }
          # The update must install OVER previous signed builds, not as a new app.
          metadata="$("$tools/aapt" dump badging "$apk" | head -n 1)"
          [[ "$metadata" == *"name='com.javierrb35.bibliotecaia'"* ]] || exit 1
          [[ "$metadata" == *"versionCode='$RELEASE_CODE'"* ]] || exit 1
          [[ "$metadata" == *"versionName='$RELEASE_VERSION'"* ]] || exit 1
          (cd dist && sha256sum "BibliotecaIA-$RELEASE_TAG.apk" > "BibliotecaIA-$RELEASE_TAG.apk.sha256")
          echo "Signed and verified $RELEASE_TAG / $RELEASE_CODE / owner certificate $actual"

      - name: Upload only verified files (private job artifact)
        uses: actions/upload-artifact@v4
        with:
          name: verified-auto-release
          path: |
            dist/*.apk
            dist/*.apk.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish official GitHub Release after verified signature
    needs: [preflight, build]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download the signed and verified APK
        uses: actions/download-artifact@v4
        with:
          name: verified-auto-release
          path: dist
      - name: Publish exactly once without replacing older releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          apk="dist/BibliotecaIA-$RELEASE_TAG.apk"
          test -s "$apk"
          test -s "$apk.sha256"
          (cd dist && sha256sum -c "BibliotecaIA-$RELEASE_TAG.apk.sha256")
          main_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$RELEASE_SHA" != "$main_head" ]]; then
            echo "No publishing obsolete builds: main has moved."
            exit 0
          fi
          already="$(gh api -X GET "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.target_commitish == \"$RELEASE_SHA\") | .tag_name" | head -n 1)"
          if [[ -n "$already" ]]; then
            echo "Commit already has release $already; no duplicate."
            exit 0
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Refusing to overwrite $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "$apk" "$apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "Biblioteca IA $RELEASE_VERSION" \
            --notes "Actualización Android firmada y comprobada. Compilación del commit $RELEASE_SHA. Serie de desarrollo; instalación voluntaria desde la aplicación." \
            --latest
          echo "Official update published: $RELEASE_TAG"
