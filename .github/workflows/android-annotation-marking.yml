name: Android EPUB annotation rendering regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/com/javierrb35/bibliotecaia/reader/epub/**'
      - 'app/src/androidTest/java/com/javierrb35/bibliotecaia/reader/epub/**'
      - '.github/workflows/android-annotation-marking.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: epub-annotation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Verify saved EPUB notes produce visual decorations on Android 34
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Permit hardware KVM when available
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          else
            echo "KVM unavailable: using TCG CPU emulation."
          fi
      - name: Run real Readium decoration regressions
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_5
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: sh ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.javierrb35.bibliotecaia.reader.epub.EpubAnnotationMarksDeviceTest --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.vfs.watch=false
      - name: Archive instrumented result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epub-annotation-marking-test-results
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 7
