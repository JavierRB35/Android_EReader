name: Android 16 real-input saved-note modal

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/com/javierrb35/bibliotecaia/reader/**'
      - 'app/src/androidTest/java/com/javierrb35/bibliotecaia/reader/**'
      - '.github/workflows/android-note-modal-api36.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android16-note-modal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android16-saved-notes:
    name: EPUB and MOBI saved notes through Android 16 window input
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM or CPU fallback
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          else
            echo "No KVM available; Android emulator will use CPU fallback."
          fi
      - name: Verify platform-injected taps reopen full saved notes on API 36
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_5
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: sh ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.javierrb35.bibliotecaia.reader.epub.EpubReadingJourneyDeviceTest,com.javierrb35.bibliotecaia.reader.mobi.MobiReadingJourneyDeviceTest --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.vfs.watch=false
      - name: Archive Android 16 test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android16-note-modal-window-input-results
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 7
