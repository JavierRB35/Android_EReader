name: Coordinator SQL (PostgreSQL)
on:
  pull_request:
    paths:
      - 'supabase/coordinator/**'
      - '.github/workflows/coordinator-sql.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/coordinator/**'
      - '.github/workflows/coordinator-sql.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coordinator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: coordinator_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply both migrations to an empty database
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          # Plain PostgreSQL has neither the client roles nor the pgcrypto schema of Supabase.
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists extensions;
          create extension if not exists pgcrypto with schema extensions;
          do $$
          begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then create role anon nologin; end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then create role authenticated nologin; end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then create role service_role nologin; end if;
          end $$;
          SQL
          psql -X -v ON_ERROR_STOP=1 -f supabase/coordinator/001_private_core.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/coordinator/002_private_pairing.sql
      - name: Sequential contract tests
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/coordinator/test_private_core.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/coordinator/test_private_pairing.sql
      - name: Concurrent sessions
        run: bash supabase/coordinator/test_private_concurrency.sh
