name: Android startup smoke (emulator)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-startup-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# No release keys, accounts or AI credentials required.
permissions:
  contents: read

jobs:
  emulator:
    name: Launch Biblioteca IA on Android emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM for the emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Validate startup smoke shell syntax
        run: sh -n scripts/android-startup-smoke.sh

      - name: Run real app launch instrumentation on Android 34
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-boot-timeout: 600
          # Existing isolated QA variant: no asynchronous live release prompts.
          # Keep the entire startup/storage suite and propagate any failure.
          script: sh scripts/android-startup-smoke.sh

      - name: Archive instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-startup-smoke-results
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 7
