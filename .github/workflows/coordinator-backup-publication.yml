name: Coordinator backup publication
on:
  pull_request:
    paths:
      - 'supabase/coordinator/backup/**'
      - '.github/workflows/coordinator-backup-publication.yml'
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test supabase/coordinator/backup/publication.test.mjs
