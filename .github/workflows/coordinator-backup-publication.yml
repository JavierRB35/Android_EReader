name: Coordinator backup publication
on:
  pull_request:
    paths:
      - 'supabase/coordinator/backup/**'
      - '.github/workflows/coordinator-backup-publication.yml'
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test supabase/coordinator/backup/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s supabase/coordinator/backup -p 'test_*.py' -v
