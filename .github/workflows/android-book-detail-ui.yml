name: Book details compact UI regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/com/javierrb35/bibliotecaia/ui/BookDetailActivity.kt'
      - 'app/src/main/java/com/javierrb35/bibliotecaia/ai/BookSynopsisRepository.kt'
      - 'app/src/main/java/com/javierrb35/bibliotecaia/data/BookSynopsisEntity.kt'
      - 'app/src/androidTest/java/com/javierrb35/bibliotecaia/ai/BookSynopsisDeviceTest.kt'
      - 'app/src/androidTest/java/com/javierrb35/bibliotecaia/ai/BookSynopsisActionDeviceTest.kt'
      - 'app/src/main/java/com/javierrb35/bibliotecaia/ui/BookOrganizationEditor.kt'
      - 'app/src/main/res/layout/activity_book_detail.xml'
      - 'app/src/main/res/drawable/bg_book_detail_*.xml'
      - 'app/src/main/res/values/strings.xml'
      - 'app/src/androidTest/java/com/javierrb35/bibliotecaia/ui/BookDetailOrganizationDeviceTest.kt'
      - '.github/workflows/android-book-detail-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-detail-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compact-detail:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM acceleration if present
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          else
            echo "No KVM available; Android emulator will use TCG."
          fi
      - name: Verify no-scroll layout and editable categories/tags/collections on small Android phone
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_5
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: adb shell wm size 900x1900 && sh ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.javierrb35.bibliotecaia.ui.BookDetailOrganizationDeviceTest,com.javierrb35.bibliotecaia.ai.BookSynopsisDeviceTest,com.javierrb35.bibliotecaia.ai.BookSynopsisActionDeviceTest --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.vfs.watch=false
      - name: Archive UI test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compact-book-detail-ui-results
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 7
